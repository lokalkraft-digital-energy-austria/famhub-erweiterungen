# Was eingereicht wird, wird gebaut und geprüft — bevor ein Mensch hineinschaut.
#
# Kein Schlüssel ist hier im Spiel: Unterschrieben wird später, von Hand, auf dem Rechner, der den
# Gemeinschaftsschlüssel hat. Diese Prüfung stellt nur fest, ob das Paket überhaupt in Frage kommt.
name: Prüfen

on:
  pull_request:
    paths: ['erweiterungen/**']

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Geänderte Erweiterungen finden
        id: ordner
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          dirs=$(git diff --name-only "$base" HEAD -- 'erweiterungen/*' | cut -d/ -f1,2 | sort -u)
          if [ -z "$dirs" ]; then echo "nichts zu prüfen"; fi
          {
            echo "dirs<<ENDE"
            echo "$dirs"
            echo "ENDE"
          } >> "$GITHUB_OUTPUT"

      # Pakete in TypeScript baut extism-js (braucht binaryen) – feste Fassungen, mit Prüfsumme
      - name: Übersetzer für TypeScript
        if: steps.ordner.outputs.dirs != ''
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSLO https://github.com/extism/js-pdk/releases/download/v1.7.0/extism-js-x86_64-linux-v1.7.0.gz
          curl -sSLO https://github.com/extism/js-pdk/releases/download/v1.7.0/extism-js-x86_64-linux-v1.7.0.gz.sha256
          curl -sSLO https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          curl -sSLO https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz.sha256
          # die .sha256 von extism-js enthält nur den Hash, die von binaryen Hash und Name – beides gleich prüfen
          for f in extism-js-x86_64-linux-v1.7.0.gz binaryen-version_133-x86_64-linux.tar.gz; do
            echo "$(cut -d' ' -f1 "$f.sha256")  $f" | sha256sum -c -
          done
          gunzip -c extism-js-x86_64-linux-v1.7.0.gz > extism-js && chmod +x extism-js
          tar xzf binaryen-version_133-x86_64-linux.tar.gz
          echo "EXTISM_JS=$RUNNER_TEMP/tools/extism-js" >> "$GITHUB_ENV"
          echo "BINARYEN_BIN=$RUNNER_TEMP/tools/binaryen-version_133/bin" >> "$GITHUB_ENV"

      - name: Bauen, prüfen, Aufnahmeregeln
        if: steps.ordner.outputs.dirs != ''
        run: |
          set -e
          for d in ${{ steps.ordner.outputs.dirs }}; do
            [ -d "$d" ] || { echo "== $d (entfernt, übersprungen)"; continue; }
            echo "== $d"
            # aus dem Quelltext bauen – genau das tut lokalkraft später auch
            npx -y -p create-famhub-plugin famhub-plugin bauen "$d"
            npx -y -p create-famhub-plugin famhub-plugin prüfen "$d"
            # die Regeln fragen `git ls-files` – das eben Gebaute stört sie deshalb nicht
            node .github/regeln.mjs "$d"
          done
